plugins {
    id 'com.android.application'
}

// 签名解析顺序：环境变量 -> keystore.properties -> 用户目录下 debug.keystore -> AGP 内置 debug 签名
def customKeystoreProps = new Properties()
def customKeystoreFile = rootProject.file("keystore.properties")
if (customKeystoreFile.exists()) {
    customKeystoreFile.withInputStream { customKeystoreProps.load(it) }
}

def envStorePath = System.getenv("KEYSTORE_FILE")
def propStorePath = customKeystoreProps.getProperty("storeFile")
def homeDebugKeystore = new File(System.getProperty("user.home"), ".android/debug.keystore")

def hasReleaseSigning = (envStorePath != null && !envStorePath.trim().isEmpty()) ||
        (propStorePath != null && !propStorePath.trim().isEmpty()) ||
        homeDebugKeystore.exists()

android {
    namespace 'io.iniwex.vowifix'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "io.iniwex.vowifix"
        minSdk 29
        targetSdk 35
        versionCode 110
        versionName "1.0.10"
    }

    signingConfigs {
        release {
            if (envStorePath != null && !envStorePath.trim().isEmpty()) {
                storeFile file(envStorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: (System.getenv("KEYSTORE_PASSWORD") ?: "")
            } else if (propStorePath != null && !propStorePath.trim().isEmpty()) {
                storeFile rootProject.file(propStorePath)
                storePassword customKeystoreProps.getProperty("storePassword", "")
                keyAlias customKeystoreProps.getProperty("keyAlias", "")
                keyPassword customKeystoreProps.getProperty("keyPassword", customKeystoreProps.getProperty("storePassword", ""))
            } else if (homeDebugKeystore.exists()) {
                storeFile homeDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/com/android/build/gradle/**',
                'META-INF/version-control-info.textproto'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly files('libs/api-82.jar')
}
